# Protocol Registry（唯一可编辑来源）
# 由 agent/scripts/generate_protocol.py 生成只读产物：
#   - backend/app/protocol/action_registry.json
#   - backend/app/schemas/generated_case_params.py
#   - frontend/src/api/generated/registry.ts
# 控制字段（controls.step）属于 Step 顶层，绝不进入 action params。

protocol_version: "3.0.0"
min_agent_version: "3.0.0"

controls:
  step:
    - continue_on_failure

actions:
  - name: launch_app
    label: 启动 APP
    version: 1
    needs_element: false
    params:
      - { name: package, type: string, required: true, label: 包名, placeholder: "com.example.app" }
      - { name: activity, type: string, label: Activity, placeholder: "com.example.MainActivity" }
      - { name: no_reset, type: boolean, default: true, label: 不重置 }
  - name: close_app
    label: 关闭 APP
    version: 1
    needs_element: false
    params:
      - { name: package, type: string, label: 包名, placeholder: "com.example.app" }
  - name: click
    label: 点击元素
    version: 1
    needs_element: true
    params:
      - { name: wait_timeout, type: integer, default: 10, min: 0, max: 300, label: 等待秒数 }
  - name: input
    label: 输入文本
    version: 1
    needs_element: true
    params:
      - { name: value, type: string, required: true, label: 文本, placeholder: "如 ${username}" }
      - { name: clear_first, type: boolean, default: true, label: 先清空 }
  - name: clear
    label: 清空输入框
    version: 1
    needs_element: true
    params: []
  - name: swipe
    label: 滑动
    version: 1
    needs_element: false
    params:
      - name: direction
        type: select
        default: up
        label: 方向
        options:
          - { value: up, label: 上滑 }
          - { value: down, label: 下滑 }
          - { value: left, label: 左滑 }
          - { value: right, label: 右滑 }
      - { name: duration, type: integer, default: 500, min: 0, label: 时长(ms) }
  - name: swipe_to_find
    label: 滑动查找元素
    version: 1
    needs_element: true
    params:
      - name: direction
        type: select
        default: up
        label: 方向
        options:
          - { value: up, label: 上滑 }
          - { value: down, label: 下滑 }
      - { name: max_swipes, type: integer, default: 5, min: 1, max: 50, label: 最大滑动次数 }
      - { name: wait_timeout, type: integer, default: 2, min: 0, max: 300, label: 每次查找等待秒数 }
      - { name: duration, type: integer, default: 500, min: 0, label: 滑动时长(ms) }
  - name: swipe_in_element
    label: 控件内滑动
    version: 1
    needs_element: true
    params:
      - name: direction
        type: select
        default: up
        label: 方向
        options:
          - { value: up, label: 上滑 }
          - { value: down, label: 下滑 }
          - { value: left, label: 左滑 }
          - { value: right, label: 右滑 }
      - { name: percent, type: number, default: 0.3, min: 0.05, max: 0.95, label: 滑动比例（0.05～0.95） }
      - { name: wait_timeout, type: integer, default: 10, min: 0, max: 300, label: 等待秒数 }
  - name: swipe_in_region
    label: 区域内滑动
    version: 1
    needs_element: false
    constraints:
      - type: percent_region
        left: left_percent
        top: top_percent
        width: width_percent
        height: height_percent
    params:
      - { name: left_percent, type: number, required: true, min: 0, max: 100, label: 左边界(%) }
      - { name: top_percent, type: number, required: true, min: 0, max: 100, label: 上边界(%) }
      - { name: width_percent, type: number, required: true, min: 0.01, max: 100, label: 宽度(%) }
      - { name: height_percent, type: number, required: true, min: 0.01, max: 100, label: 高度(%) }
      - name: direction
        type: select
        default: up
        label: 方向
        options:
          - { value: up, label: 上滑 }
          - { value: down, label: 下滑 }
          - { value: left, label: 左滑 }
          - { value: right, label: 右滑 }
      - { name: percent, type: number, default: 0.3, min: 0.05, max: 0.95, label: 滑动比例（0.05～0.95） }
  - name: swipe_in_element_find_text_click
    label: 列表内滑动查找文字并点击
    version: 1
    needs_element: true
    element_label: 列表控件
    params:
      - { name: target_text, type: string, required: true, min_length: 1, label: 目标文字, placeholder: "如 系统时间 或 ${date}" }
      - name: match_mode
        type: select
        default: equals
        label: 匹配方式
        options:
          - { value: equals, label: 精确匹配 }
          - { value: contains, label: 包含匹配 }
      - name: preferred_direction
        type: select
        default: up
        label: 首选方向
        options:
          - { value: up, label: 上滑 }
          - { value: down, label: 下滑 }
      - { name: max_swipes_per_direction, type: integer, default: 8, min: 1, max: 50, label: 每方向最大滑动次数 }
      - { name: percent, type: number, default: 0.3, min: 0.05, max: 0.95, label: 滑动比例（0.05～0.95） }
      - { name: container_wait_timeout, type: integer, default: 10, min: 0, max: 60, label: 列表等待秒数 }
      - { name: settle_ms, type: integer, default: 300, min: 0, max: 2000, label: 稳定等待(ms) }
  - name: scroll
    label: 滚动到元素
    version: 1
    needs_element: true
    params: []
  - name: back
    label: 返回键
    version: 1
    needs_element: false
    params: []
  - name: sleep
    label: 等待
    version: 1
    needs_element: false
    params:
      - { name: duration, type: number, default: 1, min: 0, label: 秒数 }
  - name: screenshot
    label: 截图
    version: 1
    needs_element: false
    params:
      - { name: filename, type: string, label: 文件名, placeholder: 留空自动生成安全文件名 }
  - name: get_text
    label: 获取文本
    version: 1
    needs_element: true
    params:
      - { name: variable_name, type: string, label: 存入变量, placeholder: 可选，如 text_1 }
  - name: get_attribute
    label: 获取属性
    version: 1
    needs_element: true
    params:
      - { name: attribute, type: string, required: true, label: 属性名, placeholder: 如 content-desc }
      - { name: variable_name, type: string, label: 存入变量, placeholder: 可选，如 attr_1 }
  - name: tap_coordinate
    label: 坐标点击
    version: 1
    needs_element: false
    params:
      - { name: x, type: integer, required: true, label: X }
      - { name: y, type: integer, required: true, label: Y }

assertions:
  - name: element_exists
    label: 元素存在/不存在
    version: 1
    needs_element: true
    params:
      - name: expected
        type: select
        default: exists
        label: 期望
        options:
          - { value: exists, label: 存在 }
          - { value: not_exists, label: 不存在 }
  - name: text_equals
    label: 文本等于
    version: 1
    needs_element: true
    params:
      - { name: expected, type: string, required: true, label: 期望值 }
      - { name: trim, type: boolean, default: false, label: 去空格 }
  - name: text_contains
    label: 文本包含
    version: 1
    needs_element: true
    params:
      - { name: expected, type: string, required: true, label: 期望值 }
  - name: text_not_contains
    label: 文本不包含
    version: 1
    needs_element: true
    params:
      - { name: expected, type: string, required: true, label: 期望值 }
  - name: attribute_equals
    label: 属性等于
    version: 1
    needs_element: true
    params:
      - { name: attribute, type: string, required: true, label: 属性名 }
      - { name: expected, type: string, required: true, label: 期望值 }
  - name: attribute_contains
    label: 属性包含
    version: 1
    needs_element: true
    params:
      - { name: attribute, type: string, required: true, label: 属性名 }
      - { name: expected, type: string, required: true, label: 期望值 }
  - name: value_equals
    label: 输入框值等于
    version: 1
    needs_element: true
    params:
      - { name: expected, type: string, required: true, label: 期望值 }
  - name: regex_match
    label: 正则匹配
    version: 1
    needs_element: true
    params:
      - { name: pattern, type: string, required: true, label: 正则, placeholder: "如 ^\\d{4}$" }
