[project]
name = "app-auto-test-agent"
version = "0.1.0"
description = "APP 自动化测试平台 Device Agent（WS 注册 + 心跳 + Appium/Mock 执行）"
requires-python = ">=3.12"
dependencies = [
    "websockets>=12",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
appium = ["appium-python-client>=6,<7"]
desktop = ["pystray>=0.19", "pillow>=10"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
