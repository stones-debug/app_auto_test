name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + alembic check + pytest + pyright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev123
          POSTGRES_DB: test_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Windows 方案 §2：测试与迁移统一使用独立测试库
      DATABASE_URL: postgresql+asyncpg://dev:dev123@127.0.0.1:5432/test_platform_test
      UV_CACHE_DIR: /tmp/uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check app/ tests/ worker.py scripts/
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Alembic check (CR-19)
        run: uv run alembic check
      - name: Test
        run: uv run pytest tests/ -q
      - name: Pyright (Step 10 first batch)
        run: uv run pyright

  agent:
    name: Agent (ruff + pytest + protocol check + pyright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    env:
      UV_CACHE_DIR: /tmp/uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "18.16.1"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest tests/ -q
      - name: Protocol generator check (Step 10)
        run: uv run python scripts/generate_protocol.py --check
      - name: Pyright (Step 10 first batch)
        run: uv run pyright

  frontend:
    name: Frontend (type check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18.16.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Print versions
        run: node --version && npm --version
      - name: Install dependencies
        run: npm ci
      - name: Test (Windows 方案 §2)
        run: npm test
      - name: Type check + build
        run: npm run build
      - name: Bundle budget (Step 11)
        run: npm run check:bundle

  windows-agent-package:
    name: Agent Windows package (self-check + PyInstaller + Inno)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    env:
      UV_CACHE_DIR: D:\a\_temp\uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (Windows 方案 §4.2)
        run: uv sync --all-extras
      - name: Test
        run: uv run pytest tests/ -q
      - name: Install Inno Setup + adb (for self-check)
        run: choco install innosetup adb -y --no-progress
      - name: Self-check
        run: uv run python main.py --config config.yaml.example --self-check
      - name: Build with PyInstaller
        run: |
          # `uv run` re-syncs without extras by default; ensure pystray/PIL are bundled
          uv sync --all-extras
          uv run --with pyinstaller pyinstaller packaging/pyinstaller.spec --noconfirm --distpath packaging/dist --workpath packaging/build
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "packaging/setup.iss" "/DAppVersion=1.1.0" "/DOutputDir=dist"
      - name: Verify installer + packaged self-check
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/app-auto-test-agent-*-windows-x64-setup.exe | Select-Object -First 1
          if (-not $exe) { throw "未生成安装包" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          Write-Host "installer: $($exe.Name) sha256: $hash"
          & "dist/app-auto-test-agent/app-auto-test-agent.exe" --config config.yaml.example --self-check
