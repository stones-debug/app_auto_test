[project]
name = "app-auto-test-backend"
version = "0.1.0"
description = "APP 自动化测试平台后端（FastAPI + SQLAlchemy 2.0 + PostgreSQL）"
readme = "README.md"
authors = [
    { name = "shijinsong", email = "jsshi@tl-tek.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10",
    "websockets>=12",
    "jinja2>=3.1",
    "email-validator>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
